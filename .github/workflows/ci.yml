name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Only reading the repository is needed; no secrets or GitHub token are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and the build cache between runs.
      - uses: gradle/actions/setup-gradle@v4

      # `:core:domain` is a pure Kotlin module, so its tests run with `test`, not `testDebugUnitTest`.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:domain:test

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: square-repos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
